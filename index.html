<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COS3712 Space Station</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: sans-serif;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      #title-overlay {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        color: #fff;
        font-family: sans-serif;
        pointer-events: none;
      }

      #title-overlay h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.2;
      }

      #title-overlay p {
        margin: 4px 0 0;
        font-size: 13px;
        opacity: 0.9;
        line-height: 1.2;
      }

      #shading-overlay {
        position: fixed;
        top: 74px;
        left: 12px;
        z-index: 10;
        width: min(560px, calc(100vw - 96px));
        max-height: calc(100vh - 96px);
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-family: sans-serif;
        overflow: auto;
        pointer-events: auto;
      }

      #shading-summary {
        margin: 0;
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 11px;
        line-height: 1.4;
      }

      #controls-overlay {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .control-button {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        border: 2px solid #fff;
        border-radius: 50%;
        padding: 0;
        background: #2a2f36;
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        line-height: 1.05;
        cursor: pointer;
      }

      .control-button:hover {
        background: #4c6172;
      }

      .control-icon {
        width: 24px;
        height: 24px;
        display: block;
        pointer-events: none;
        filter: brightness(0) invert(1);
      }

    </style>
  </head>
  <body>
    <div id="title-overlay">
      <h1>COS3712 Space Station - Part 2</h1>
      <p>50052578 Jones GWE</p>
    </div>
    <div id="shading-overlay">
      <pre id="shading-summary">Loading shading assignments...</pre>
    </div>
    <div id="controls-overlay" aria-label="Scene controls">
      <button id="reset-camera" class="control-button" type="button" aria-label="Reset Camera" title="Reset Camera">
        <img class="control-icon" src="./assets/icons/controls/reset-camera.svg" alt="" />
      </button>
      <button id="cycle-view" class="control-button" type="button" aria-label="Switch Camera" title="Switch Camera">
        <img class="control-icon" src="./assets/icons/controls/switch-camera.svg" alt="" />
      </button>
      <button id="zoom-in" class="control-button" type="button" aria-label="Zoom In" title="Zoom In">
        <img class="control-icon" src="./assets/icons/controls/zoom-in.svg" alt="" />
      </button>
      <button id="zoom-out" class="control-button" type="button" aria-label="Zoom Out" title="Zoom Out">
        <img class="control-icon" src="./assets/icons/controls/zoom-out.svg" alt="" />
      </button>
      <button id="move-left" class="control-button" type="button" aria-label="Move Left" title="Move Left">
        <img class="control-icon" src="./assets/icons/controls/move-left.svg" alt="" />
      </button>
      <button id="move-right" class="control-button" type="button" aria-label="Move Right" title="Move Right">
        <img class="control-icon" src="./assets/icons/controls/move-right.svg" alt="" />
      </button>
      <button id="move-up" class="control-button" type="button" aria-label="Move Up" title="Move Up">
        <img class="control-icon" src="./assets/icons/controls/move-up.svg" alt="" />
      </button>
      <button id="move-down" class="control-button" type="button" aria-label="Move Down" title="Move Down">
        <img class="control-icon" src="./assets/icons/controls/move-down.svg" alt="" />
      </button>
      <button id="move-forward" class="control-button" type="button" aria-label="Move Forward" title="Move Forward">
        <img class="control-icon" src="./assets/icons/controls/move-forward.svg" alt="" />
      </button>
      <button id="move-backward" class="control-button" type="button" aria-label="Move Backward" title="Move Backward">
        <img class="control-icon" src="./assets/icons/controls/move-backward.svg" alt="" />
      </button>
      <button id="pan-left" class="control-button" type="button" aria-label="Pan Left" title="Pan Left">
        <img class="control-icon" src="./assets/icons/controls/pan-left.svg" alt="" />
      </button>
      <button id="pan-right" class="control-button" type="button" aria-label="Pan Right" title="Pan Right">
        <img class="control-icon" src="./assets/icons/controls/pan-right.svg" alt="" />
      </button>
      <button id="tilt-up" class="control-button" type="button" aria-label="Tilt Up" title="Tilt Up">
        <img class="control-icon" src="./assets/icons/controls/tilt-up.svg" alt="" />
      </button>
      <button id="tilt-down" class="control-button" type="button" aria-label="Tilt Down" title="Tilt Down">
        <img class="control-icon" src="./assets/icons/controls/tilt-down.svg" alt="" />
      </button>
      <button id="toggle-shading-mode" class="control-button" type="button" aria-label="Shading Mode" title="Shading Mode">
        <img class="control-icon" src="./assets/icons/controls/stroke-partial.svg" alt="" />
      </button>
      <button id="toggle-orbit" class="control-button" type="button" aria-label="Pause Orbit" title="Pause Orbit">
        <img id="toggle-orbit-icon" class="control-icon" src="./assets/icons/controls/pause-orbit.svg" alt="" />
      </button>
    </div>
    <div id="app"></div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
