<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COS3712 Space Station - Part 1</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: sans-serif;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      #title-overlay {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        color: #fff;
        font-family: sans-serif;
        pointer-events: none;
      }

      #title-overlay h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.2;
      }

      #title-overlay p {
        margin: 4px 0 0;
        font-size: 13px;
        opacity: 0.9;
        line-height: 1.2;
      }

      #controls-overlay {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .control-button {
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        border: 2px solid #fff;
        border-radius: 50%;
        padding: 0;
        background: #2a2f36;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.1;
        cursor: pointer;
      }

    </style>
  </head>
  <body>
    <div id="title-overlay">
      <h1>COS3712 Space Station - Part 1</h1>
      <p>50052578 Jones GWE</p>
    </div>
    <div id="controls-overlay" aria-label="Scene controls">
      <button id="toggle-orbit" class="control-button" type="button">Pause Orbit</button>
      <button id="reset-camera" class="control-button" type="button">Reset Camera</button>
    </div>
    <div id="app"></div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
